name: Live Site Smoke Test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for Cloudflare deployment
        run: sleep 60
      - name: Run live Playwright checks
        env:
          LIVE_URL: https://certprep-hub.tkarthick828.workers.dev
        run: npx playwright test --workers=1
